name: Publish to npm

# Each release reaches main as one commit that sets the version in package.json. When main has a
# version with no v<version> tag yet, this builds, tests and publishes it to npm with provenance,
# then tags the commit and makes the GitHub release from the CHANGELOG.md entry.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  NODE_VERSION: 22.18.0
  REGISTRY_URL: https://registry.npmjs.org

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Is this version released yet
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "v${version} is already released"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-Prod
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Clean install
        run: npm ci

      - name: Verify the provenance attestations and registry signatures of the dependencies
        run: npm audit signatures

      - name: Test
        run: npm test

      # The AWS credentials and the npm token come only now, after install and tests, so no
      # dependency script run by npm ci or npm test can read them.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: ${{ secrets.AWS_SECRETS_PROD_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION_FOR_ROLE_FOR_GITHUB }}
          role-session-name: OIDCSession

      - name: Fetch the npm token
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: NPM_TOKEN, npm-token-rw

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          if npm view "${name}@${VERSION}" version > /dev/null 2>&1; then
            echo "${name}@${VERSION} is already on npm; only the tag and release are missing"
          else
            # dist was built by npm ci before the credentials existed; --ignore-scripts keeps
            # prepare (and any other script) from running while the token is in the environment.
            npm publish --provenance --access public --ignore-scripts
          fi

      - name: Tag and make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The CHANGELOG.md section for this version, without its heading.
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
