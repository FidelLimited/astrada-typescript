name: Bug report
description: Something in the TypeScript SDK does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Report a security problem privately instead (see SECURITY.md).
        Never paste card numbers, access tokens, client secrets or webhook secrets here, not even sandbox ones.
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: From npm ls @astrada.co/ts-astrada-sdk.
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Node.js version
      placeholder: "22.11.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - sandbox
        - production
        - both
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request id
      description: The x-request-id (or x-amzn-requestid) header of the API's response, if you have one.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps, or a short code sample that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The error message or wrong result, with the stack trace if there is one.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you send
      options:
        - label: I removed card numbers, tokens and secrets from this report.
          required: true
